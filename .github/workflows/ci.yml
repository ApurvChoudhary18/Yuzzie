name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # @yuzie/server's suites run against a real Postgres via testcontainers.
      # GitHub's Linux runners ship Docker; their macOS runners do not, so the
      # macOS legs verify everything else and Linux covers the database layer.
      - name: Test
        if: runner.os == 'Linux'
        run: pnpm turbo test

      - name: Test (macOS — no Docker runtime for testcontainers)
        if: runner.os == 'macOS'
        run: pnpm turbo test --filter='!@yuzie/server'

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: CLI binary prints a version
        run: node packages/cli/dist/index.js --version

      # Performance budgets run alone, so they measure the code rather than the
      # runner. Linux only: the macOS legs skip @yuzie/server and are noisier.
      - name: Performance budgets
        if: runner.os == 'Linux'
        run: pnpm turbo bench --concurrency=1
